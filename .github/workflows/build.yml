name: Build Douyin Liquid Glass Diagnostic

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android SDK 37
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platforms;android-37" "build-tools;37.0.0" "platform-tools"

      - name: Prepare Gradle repositories
        run: |
          mkdir -p ~/.gradle

          cat > ~/.gradle/init.gradle <<'EOF'
          allprojects {
              repositories {
                  google()
                  mavenCentral()
              }
          }

          settingsEvaluated { settings ->
              settings.pluginManagement {
                  repositories {
                      google()
                      mavenCentral()
                      gradlePluginPortal()
                  }
              }

              settings.dependencyResolutionManagement {
                  repositories {
                      google()
                      mavenCentral()
                  }
              }
          }
          EOF

      - name: Make Gradle executable
        run: chmod +x ./gradlew

      - name: Build Release APK
        run: ./gradlew assembleRelease --stacktrace

      - name: Find APK
        run: |
          echo "=== APK files ==="
          find . -type f -name "*.apk" -print

      - name: Package diagnostic APK
        run: |
          mkdir -p diagnostic-output

          find . -type f -name "*.apk" -exec cp {} diagnostic-output/ \;

          echo "=== Packaged files ==="
          ls -lah diagnostic-output

          cd diagnostic-output
          zip -r ../Douyin-Liquid-Glass-v15-diagnostic-instrumented.zip .

      - name: Upload diagnostic build
        uses: actions/upload-artifact@v4
        with:
          name: Douyin-Liquid-Glass-v15-diagnostic-instrumented
          path: Douyin-Liquid-Glass-v15-diagnostic-instrumented.zip
          if-no-files-found: error

name: Build APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "Douyin-Liquid-Glass-v7-progress-touch-fix-build-ready.zip"
      - ".github/workflows/build.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ""

      - name: Accept Android SDK licenses
        run: |
          yes | sdkmanager --licenses || true

      - name: Install Android SDK 37
        run: |
          sdkmanager "platforms;android-37.0"
          sdkmanager "build-tools;37.0.0"

      - name: Extract project
        run: |
          rm -rf project
          mkdir -p project
          unzip -q "Douyin-Liquid-Glass-v7-progress-touch-fix-build-ready.zip" -d project

      - name: Find project root
        run: |
          echo "Searching for Gradle project..."
          find project -name "gradlew" -type f -print

      - name: Make Gradle executable
        run: |
          GRADLEW=$(find project -name "gradlew" -type f | head -1)

          if [ -z "$GRADLEW" ]; then
            echo "ERROR: gradlew not found!"
            exit 1
          fi

          chmod +x "$GRADLEW"
          echo "GRADLEW=$GRADLEW" >> "$GITHUB_ENV"

      - name: Configure Maven repositories
        run: |
          mkdir -p ~/.gradle

          cat > ~/.gradle/init.gradle <<'EOF'
          allprojects {
              buildscript {
                  repositories {
                      google()
                      mavenCentral()
                  }
              }

              repositories {
                  google()
                  mavenCentral()
              }
          }
          EOF

      - name: Check Gradle
        run: |
          PROJECT_DIR=$(dirname "$GRADLEW")
          cd "$PROJECT_DIR"
          ./gradlew --version

      - name: Build APK
        run: |
          PROJECT_DIR=$(dirname "$GRADLEW")
          cd "$PROJECT_DIR"

          ./gradlew :app:assembleDebug \
            --no-daemon \
            --stacktrace \
            --info \
            --console=plain

      - name: Find APK
        run: |
          echo "APK files:"
          find project -type f -name "*.apk" -print

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Douyin-Liquid-Glass-v7
          path: project/**/build/outputs/apk/**/*.apk
          if-no-files-found: error

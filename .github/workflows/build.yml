name: Build Douyin Liquid Glass V4

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. 拉取 GitHub 仓库
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. 准备 JDK
      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # 3. 找到 V4 源码 ZIP
      - name: Find V4 source ZIP
        shell: bash
        run: |
          set -e

          ZIP_FILE=$(find . -maxdepth 2 -type f \
            -name 'Douyin-Liquid-Glass-v4-height50-refraction-fix.zip' \
            | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: V4 source ZIP not found."
            echo "Files in repository:"
            find . -maxdepth 3 -type f | sort
            exit 1
          fi

          echo "Found: $ZIP_FILE"
          echo "ZIP_FILE=$ZIP_FILE" >> "$GITHUB_ENV"

      # 4. 解压 V4 源码
      - name: Extract V4 source
        shell: bash
        run: |
          set -e

          rm -rf build-project
          mkdir -p build-project

          unzip -q "$ZIP_FILE" -d build-project

          echo "Extracted files:"
          find build-project -maxdepth 3 -type f | sort | head -200

      # 5. 自动寻找 Gradle 项目根目录
      - name: Locate Gradle project
        shell: bash
        run: |
          set -e

          GRADLEW=$(find build-project -type f -name gradlew | head -n 1)

          if [ -z "$GRADLEW" ]; then
            echo "ERROR: gradlew not found."
            find build-project -maxdepth 5 -type f | sort
            exit 1
          fi

          PROJECT_DIR=$(dirname "$GRADLEW")

          echo "gradlew: $GRADLEW"
          echo "Project directory: $PROJECT_DIR"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          chmod +x "$GRADLEW"

      # 6. 检查 Gradle / Android 项目
      - name: Check Gradle project
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          echo "===== Gradle files ====="
          ls -la

          echo "===== Gradle version ====="
          ./gradlew --version

      # 7. 构建 Release APK
      - name: Build Release APK
        shell: bash
        env:
          GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8"
        run: |
          set -e

          cd "$PROJECT_DIR"

          ./gradlew \
            --no-daemon \
            --stacktrace \
            assembleRelease

      # 8. 找到本次构建产生的 APK
      - name: Locate built APK
        shell: bash
        run: |
          set -e

          echo "===== APK files generated by build ====="
          find "$PROJECT_DIR" \
            -type f \
            -path '*/build/outputs/apk/release/*.apk' \
            -print

          APK=$(find "$PROJECT_DIR" \
            -type f \
            -path '*/build/outputs/apk/release/*.apk' \
            -name '*.apk' \
            | head -n 1)

          if [ -z "$APK" ]; then
            echo "ERROR: Release APK not found."
            exit 1
          fi

          echo "APK=$APK" >> "$GITHUB_ENV"
          echo "Found APK: $APK"

      # 9. 准备 Android SDK build-tools
      - name: Prepare Android build tools
        shell: bash
        run: |
          set -e

          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"

          if [ -x "$SDKMANAGER" ]; then
            "$SDKMANAGER" --install "build-tools;35.0.0" || true
          fi

          BUILD_TOOLS=$(find "$ANDROID_HOME/build-tools" \
            -maxdepth 1 \
            -mindepth 1 \
            -type d \
            | sort -V \
            | tail -n 1)

          if [ -z "$BUILD_TOOLS" ]; then
            echo "ERROR: Android build-tools not found."
            exit 1
          fi

          echo "BUILD_TOOLS=$BUILD_TOOLS" >> "$GITHUB_ENV"
          echo "Using build-tools: $BUILD_TOOLS"

      # 10. 自动生成签名密钥
      - name: Generate signing keystore
        shell: bash
        run: |
          set -e

          mkdir -p signing

          keytool \
            -genkeypair \
            -v \
            -keystore signing/release.keystore \
            -alias douyin \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass douyin123456 \
            -keypass douyin123456 \
            -dname "CN=Douyin Liquid Glass, OU=Android, O=Local, L=Tokyo, ST=Tokyo, C=JP"

      # 11. 签名 APK
      - name: Sign APK
        shell: bash
        run: |
          set -e

          mkdir -p output

          UNSIGNED_APK="$APK"
          SIGNED_APK="output/Douyin-Liquid-Glass-v4-signed.apk"

          echo "Unsigned APK:"
          echo "$UNSIGNED_APK"

          echo "Signing..."

          "$BUILD_TOOLS/apksigner" sign \
            --ks signing/release.keystore \
            --ks-key-alias douyin \
            --ks-pass pass:douyin123456 \
            --key-pass pass:douyin123456 \
            --out "$SIGNED_APK" \
            "$UNSIGNED_APK"

          echo "Signed APK:"
          ls -lh "$SIGNED_APK"

      # 12. 验证 APK 签名
      - name: Verify APK signature
        shell: bash
        run: |
          set -e

          "$BUILD_TOOLS/apksigner" verify \
            --verbose \
            output/Douyin-Liquid-Glass-v4-signed.apk

      # 13. 上传最终 APK
      - name: Upload signed APK
        uses: actions/upload-artifact@v4
        with:
          name: Douyin-Liquid-Glass-v4-signed
          path: output/Douyin-Liquid-Glass-v4-signed.apk
          if-no-files-found: error
          retention-days: 7

name: Build Douyin Liquid Glass Diagnostic

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Check Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          sdkmanager --version || true
          ls -la "$ANDROID_HOME" || true

      - name: Prepare Gradle repositories
        run: |
          mkdir -p ~/.gradle

          cat > ~/.gradle/init.gradle <<'EOF'
          allprojects {
              repositories {
                  google()
                  mavenCentral()
              }
          }

          settingsEvaluated { settings ->
              settings.pluginManagement {
                  repositories {
                      google()
                      mavenCentral()
                      gradlePluginPortal()
                  }
              }

              settings.dependencyResolutionManagement {
                  repositories {
                      google()
                      mavenCentral()
                  }
              }
          }
          EOF

      - name: Check project
        working-directory: project
        run: |
          echo "=== Project ==="
          pwd
          ls -la

          echo "=== Gradle files ==="
          find . -maxdepth 3 \( \
            -name "gradlew" -o \
            -name "settings.gradle*" -o \
            -name "build.gradle*" -o \
            -name "gradle-wrapper.properties" \
          \) -print

      - name: Make Gradle executable
        working-directory: project
        run: chmod +x ./gradlew

      - name: Build Release APK
        working-directory: project
        run: ./gradlew assembleRelease --stacktrace

      - name: Find APK
        working-directory: project
        run: |
          echo "=== APK files ==="
          find . -type f -name "*.apk" -print

      - name: Package diagnostic APK
        run: |
          mkdir -p diagnostic-output

          find project -type f -name "*.apk" -exec cp {} diagnostic-output/ \;

          echo "=== Packaged files ==="
          ls -lah diagnostic-output

          cd diagnostic-output
          zip -r ../Douyin-Liquid-Glass-v15-diagnostic-instrumented.zip .

      - name: Upload diagnostic build
        uses: actions/upload-artifact@v4
        with:
          name: Douyin-Liquid-Glass-v15-diagnostic-instrumented
          path: Douyin-Liquid-Glass-v15-diagnostic-instrumented.zip
          if-no-files-found: error

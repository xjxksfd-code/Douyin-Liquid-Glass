name: Build Douyin Liquid Glass V3 Bar Height Signed

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Check repository
        run: |
          echo "=== Repository ==="
          pwd
          echo "=== Files ==="
          find . -maxdepth 2 -type f -print | sort

      - name: Extract V3 bar height source
        shell: bash
        run: |
          set -e

          ZIP="Douyin-Liquid-Glass-v3-bar-height-control-source-2.zip"

          if [ ! -f "$ZIP" ]; then
            echo "ERROR: Source ZIP not found:"
            echo "$ZIP"
            echo
            echo "Available ZIP files:"
            find . -type f -name "*.zip" -print
            exit 1
          fi

          rm -rf source-project
          mkdir -p source-project

          unzip -q "$ZIP" -d source-project

          echo "=== Extracted source ==="
          find source-project -maxdepth 4 -type f -print | sort | head -400

      - name: Locate Gradle project
        shell: bash
        run: |
          set -e

          GRADLEW=$(find source-project \
            -type f \
            -name "gradlew" \
            -print -quit)

          if [ -z "$GRADLEW" ]; then
            echo "ERROR: gradlew was not found."
            echo
            echo "Searching extracted source:"
            find source-project -maxdepth 6 -type f -print
            exit 1
          fi

          PROJECT_DIR=$(dirname "$GRADLEW")

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo "=== Gradle project ==="
          echo "$PROJECT_DIR"

          ls -la "$PROJECT_DIR"

      - name: Prepare Gradle repositories
        run: |
          mkdir -p ~/.gradle

          cat > ~/.gradle/init.gradle <<'EOF'
          allprojects {
              repositories {
                  google()
                  mavenCentral()
              }
          }

          settingsEvaluated { settings ->
              settings.pluginManagement {
                  repositories {
                      google()
                      mavenCentral()
                      gradlePluginPortal()
                  }
              }

              settings.dependencyResolutionManagement {
                  repositories {
                      google()
                      mavenCentral()
                  }
              }
          }
          EOF

      - name: Make Gradle executable
        run: |
          chmod +x "$PROJECT_DIR/gradlew"

      - name: Build Release APK
        run: |
          set -e

          cd "$PROJECT_DIR"

          ./gradlew clean assembleRelease --stacktrace

      - name: Locate newly built APK
        shell: bash
        run: |
          set -e

          RELEASE_DIR="$PROJECT_DIR/app/build/outputs/apk/release"

          echo "=== Release directory ==="
          ls -lah "$RELEASE_DIR" || true

          APK=$(find "$RELEASE_DIR" \
            -type f \
            -name "*.apk" \
            -print -quit)

          if [ -z "$APK" ]; then
            echo "ERROR: No Release APK was generated."

            echo "=== Build outputs ==="
            find "$PROJECT_DIR/app/build/outputs" \
              -type f \
              -print || true

            exit 1
          fi

          echo "APK=$APK" >> "$GITHUB_ENV"

          echo "=== Newly generated APK ==="
          ls -lah "$APK"

      - name: Generate signing key
        run: |
          set -e

          mkdir -p signing

          keytool -genkeypair \
            -v \
            -keystore signing/douyin-liquid-glass.jks \
            -alias douyin \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass douyin123456 \
            -keypass douyin123456 \
            -dname "CN=Douyin Liquid Glass, OU=Android, O=LiquidGlass, L=Tokyo, ST=Tokyo, C=JP"

      - name: Align APK
        shell: bash
        run: |
          set -e

          BUILD_TOOLS=$(find "$ANDROID_HOME/build-tools" \
            -mindepth 1 \
            -maxdepth 1 \
            -type d \
            | sort -V \
            | tail -1)

          echo "Using Build Tools:"
          echo "$BUILD_TOOLS"

          "$BUILD_TOOLS/zipalign" \
            -f \
            4 \
            "$APK" \
            aligned.apk

      - name: Sign APK
        shell: bash
        run: |
          set -e

          BUILD_TOOLS=$(find "$ANDROID_HOME/build-tools" \
            -mindepth 1 \
            -maxdepth 1 \
            -type d \
            | sort -V \
            | tail -1)

          "$BUILD_TOOLS/apksigner" sign \
            --ks signing/douyin-liquid-glass.jks \
            --ks-key-alias douyin \
            --ks-pass pass:douyin123456 \
            --key-pass pass:douyin123456 \
            --out Douyin-Liquid-Glass-v3-bar-height-control-signed.apk \
            aligned.apk

      - name: Verify APK
        shell: bash
        run: |
          set -e

          BUILD_TOOLS=$(find "$ANDROID_HOME/build-tools" \
            -mindepth 1 \
            -maxdepth 1 \
            -type d \
            | sort -V \
            | tail -1)

          echo "=== Verifying APK signature ==="

          "$BUILD_TOOLS/apksigner" verify \
            --verbose \
            Douyin-Liquid-Glass-v3-bar-height-control-signed.apk

          echo
          echo "=== Signed APK ==="
          ls -lah Douyin-Liquid-Glass-v3-bar-height-control-signed.apk

      - name: Package final APK
        shell: bash
        run: |
          set -e

          mkdir -p final-output

          cp \
            Douyin-Liquid-Glass-v3-bar-height-control-signed.apk \
            final-output/

          cd final-output

          zip -q \
            ../Douyin-Liquid-Glass-v3-bar-height-control-signed.zip \
            Douyin-Liquid-Glass-v3-bar-height-control-signed.apk

          echo "=== FINAL OUTPUT ==="
          ls -lah ../Douyin-Liquid-Glass-v3-bar-height-control-signed.zip
          ls -lah Douyin-Liquid-Glass-v3-bar-height-control-signed.apk

      - name: Upload final APK
        uses: actions/upload-artifact@v4
        with:
          name: Douyin-Liquid-Glass-v3-bar-height-control-signed
          path: |
            Douyin-Liquid-Glass-v3-bar-height-control-signed.apk
            Douyin-Liquid-Glass-v3-bar-height-control-signed.zip
          if-no-files-found: error

name: Build Douyin Liquid Glass

on:
  workflow_dispatch:
  push:
    paths:
      - '**/*.kt'
      - '**/*.java'
      - '**/*.kts'
      - '**/*.xml'
      - 'gradle/**'
      - 'gradlew'
      - 'gradle.properties'
      - 'settings.gradle.kts'
      - 'build.gradle.kts'
      - 'app/**'
      - '.github/workflows/build.yml'

permissions:
  contents: read

env:
  GRADLE_OPTS: -Dorg.gradle.daemon=false -Dorg.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
          cache-dependency-path: |
            **/gradle-wrapper.properties
            **/*.gradle
            **/*.gradle.kts
            **/gradle.properties
            **/libs.versions.toml

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses >/dev/null || true

      - name: Install Android SDK packages
        shell: bash
        run: |
          install_pkg() {
            local pkg="$1"
            for ch in 3 2 1 0; do
              if sdkmanager --channel="$ch" --list 2>/dev/null | grep -Fq "$pkg"; then
                echo "Installing $pkg from channel $ch"
                sdkmanager --channel="$ch" --install "$pkg"
                return 0
              fi
            done
            echo "Falling back to default channel for $pkg"
            sdkmanager --install "$pkg"
          }
          install_pkg 'platform-tools'
          install_pkg 'platforms;android-37'
          install_pkg 'build-tools;36.0.0'

      - name: Ensure Gradle wrapper is executable
        run: chmod +x gradlew

      - name: Validate project structure
        run: |
          test -f gradlew
          test -f gradle/wrapper/gradle-wrapper.jar
          test -f app/build.gradle.kts

      - name: Build debug APK
        run: ./gradlew --no-daemon :app:assembleDebug --stacktrace

      - name: Collect APK
        run: |
          mkdir -p artifacts
          find app/build/outputs/apk -type f -name '*.apk' -exec cp {} artifacts/ \;
          test -n "$(find artifacts -type f -name '*.apk' -print -quit)"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Douyin-Liquid-Glass-debug
          path: artifacts/*.apk
          if-no-files-found: error
          retention-days: 14
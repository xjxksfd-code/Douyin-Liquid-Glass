name: Build Douyin Liquid Glass V3 Signed

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Locate Android project
        shell: bash
        run: |
          set -e

          echo "=== Repository ==="
          pwd
          find . -maxdepth 3 -type f | sort | head -300

          GRADLEW=$(find . -type f -name "gradlew" -print -quit || true)

          if [ -z "$GRADLEW" ]; then
            echo "gradlew not found."
            exit 1
          fi

          PROJECT_DIR=$(dirname "$GRADLEW")

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo "=== Android project ==="
          echo "$PROJECT_DIR"
          ls -la "$PROJECT_DIR"

      - name: Prepare Gradle repositories
        run: |
          mkdir -p ~/.gradle

          cat > ~/.gradle/init.gradle <<'EOF'
          allprojects {
              repositories {
                  google()
                  mavenCentral()
              }
          }

          settingsEvaluated { settings ->
              settings.pluginManagement {
                  repositories {
                      google()
                      mavenCentral()
                      gradlePluginPortal()
                  }
              }

              settings.dependencyResolutionManagement {
                  repositories {
                      google()
                      mavenCentral()
                  }
              }
          }
          EOF

      - name: Make Gradle executable
        run: |
          chmod +x "$PROJECT_DIR/gradlew"

      - name: Build Release APK
        run: |
          cd "$PROJECT_DIR"
          ./gradlew clean assembleRelease --stacktrace

      - name: Locate newly built APK
        shell: bash
        run: |
          set -e

          APK=$(find "$PROJECT_DIR/app/build/outputs/apk/release" \
            -type f \
            -name "*.apk" \
            -print -quit)

          if [ -z "$APK" ]; then
            echo "ERROR: Release APK not found."
            find "$PROJECT_DIR/app/build/outputs" -type f -print || true
            exit 1
          fi

          echo "APK=$APK" >> "$GITHUB_ENV"

          echo "=== Release APK ==="
          ls -lah "$APK"

      - name: Generate signing key
        run: |
          set -e

          mkdir -p signing

          keytool -genkeypair \
            -v \
            -keystore signing/douyin-liquid-glass.jks \
            -alias douyin \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass douyin123456 \
            -keypass douyin123456 \
            -dname "CN=Douyin Liquid Glass, OU=Android, O=LiquidGlass, L=Tokyo, ST=Tokyo, C=JP"

      - name: Sign APK
        run: |
          set -e

          BUILD_TOOLS=$(ls -d "$ANDROID_HOME/build-tools/"* | sort -V | tail -1)

          "$BUILD_TOOLS/zipalign" \
            -f \
            4 \
            "$APK" \
            signed-aligned.apk

          "$BUILD_TOOLS/apksigner" sign \
            --ks signing/douyin-liquid-glass.jks \
            --ks-key-alias douyin \
            --ks-pass pass:douyin123456 \
            --key-pass pass:douyin123456 \
            --out Douyin-Liquid-Glass-v3-signed.apk \
            signed-aligned.apk

      - name: Verify APK signature
        run: |
          set -e

          BUILD_TOOLS=$(ls -d "$ANDROID_HOME/build-tools/"* | sort -V | tail -1)

          "$BUILD_TOOLS/apksigner" verify \
            --verbose \
            Douyin-Liquid-Glass-v3-signed.apk

      - name: Package signed APK
        run: |
          set -e

          mkdir -p output

          cp Douyin-Liquid-Glass-v3-signed.apk output/

          echo "=== Final output ==="
          ls -lah output

          cd output

          zip -r ../Douyin-Liquid-Glass-v3-bar-height-control-signed.zip .

      - name: Upload signed APK
        uses: actions/upload-artifact@v4
        with:
          name: Douyin-Liquid-Glass-v3-bar-height-control-signed
          path: |
            Douyin-Liquid-Glass-v3-signed.apk
            Douyin-Liquid-Glass-v3-bar-height-control-signed.zip
          if-no-files-found: error

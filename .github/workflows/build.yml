name: Build Douyin-Liquid-Glass

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 37
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platforms;android-37" "build-tools;37.0.0"

      - name: Grant Gradle permission
        run: chmod +x ./gradlew

      - name: Build APK
        run: |
          ./gradlew assembleRelease --no-daemon

      - name: Rename APK
        run: |
          mkdir -p release
          cp app/build/outputs/apk/release/*.apk \
            release/Douyin-Liquid-Glass-v15-diagnostic-instrumented.apk

      - name: Create ZIP
        run: |
          cd release
          zip -j \
            ../Douyin-Liquid-Glass-v15-diagnostic-instrumented.zip \
            Douyin-Liquid-Glass-v15-diagnostic-instrumented.apk

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: Douyin-Liquid-Glass-v15-diagnostic-instrumented
          path: Douyin-Liquid-Glass-v15-diagnostic-instrumented.zip
          if-no-files-found: error

name: Build Douyin Liquid Glass V4

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      # ==========================================
      # 1. 拉取仓库
      # ==========================================
      - name: Checkout repository
        uses: actions/checkout@v4


      # ==========================================
      # 2. 安装 JDK 21
      # 不使用 cache: gradle
      # ==========================================
      - name: Setup JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'


      # ==========================================
      # 3. 查找 V4 源码 ZIP
      # ==========================================
      - name: Find V4 source ZIP
        shell: bash
        run: |
          set -e

          echo "======================================"
          echo "Searching for V4 source ZIP..."
          echo "======================================"

          ZIP_FILE=$(find . \
            -maxdepth 3 \
            -type f \
            -name 'Douyin-Liquid-Glass-v4-height50-refraction-fix.zip' \
            | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo ""
            echo "ERROR: V4 source ZIP not found."
            echo ""
            echo "Repository files:"
            find . -maxdepth 4 -type f | sort
            exit 1
          fi

          echo ""
          echo "Found:"
          echo "$ZIP_FILE"

          echo "ZIP_FILE=$ZIP_FILE" >> "$GITHUB_ENV"


      # ==========================================
      # 4. 解压 V4 源码
      # ==========================================
      - name: Extract V4 source
        shell: bash
        run: |
          set -e

          echo "======================================"
          echo "Extracting V4 source..."
          echo "======================================"

          rm -rf build-project
          mkdir -p build-project

          unzip -q "$ZIP_FILE" -d build-project

          echo ""
          echo "Extraction complete."

          echo ""
          echo "Project files:"
          find build-project -maxdepth 4 -type f | sort | head -300


      # ==========================================
      # 5. 找到真正的 Gradle 项目
      # ==========================================
      - name: Locate Gradle project
        shell: bash
        run: |
          set -e

          echo "======================================"
          echo "Searching for gradlew..."
          echo "======================================"

          GRADLEW=$(find build-project \
            -type f \
            -name gradlew \
            | head -n 1)

          if [ -z "$GRADLEW" ]; then
            echo ""
            echo "ERROR: gradlew not found."

            echo ""
            echo "Directory structure:"
            find build-project -maxdepth 6 -type f | sort

            exit 1
          fi

          PROJECT_DIR=$(dirname "$GRADLEW")

          chmod +x "$GRADLEW"

          echo ""
          echo "Gradle wrapper:"
          echo "$GRADLEW"

          echo ""
          echo "Gradle project directory:"
          echo "$PROJECT_DIR"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"


      # ==========================================
      # 6. 检查 JDK 21
      # ==========================================
      - name: Check Java
        shell: bash
        run: |
          set -e

          echo "======================================"
          echo "Java information"
          echo "======================================"

          java -version

          echo ""
          echo "JAVA_HOME:"
          echo "$JAVA_HOME"


      # ==========================================
      # 7. 检查 Gradle
      # ==========================================
      - name: Check Gradle
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          echo "======================================"
          echo "Gradle information"
          echo "======================================"

          ./gradlew --version


      # ==========================================
      # 8. 构建 Release APK
      # ==========================================
      - name: Build Release APK
        shell: bash
        env:
          GRADLE_OPTS: >-
            -Dorg.gradle.jvmargs=-Xmx2g
            -Dfile.encoding=UTF-8
        run: |
          set -e

          cd "$PROJECT_DIR"

          echo "======================================"
          echo "Building Release APK"
          echo "======================================"

          ./gradlew \
            --no-daemon \
            --stacktrace \
            assembleRelease


      # ==========================================
      # 9. 查找生成的 APK
      # ==========================================
      - name: Locate built APK
        shell: bash
        run: |
          set -e

          echo "======================================"
          echo "Searching for Release APK..."
          echo "======================================"

          find "$PROJECT_DIR" \
            -type f \
            -path '*/build/outputs/apk/release/*.apk' \
            -print

          APK=$(find "$PROJECT_DIR" \
            -type f \
            -path '*/build/outputs/apk/release/*.apk' \
            -name '*.apk' \
            | head -n 1)

          if [ -z "$APK" ]; then
            echo ""
            echo "ERROR: Release APK not found."
            exit 1
          fi

          echo ""
          echo "Found APK:"
          echo "$APK"

          echo "APK=$APK" >> "$GITHUB_ENV"


      # ==========================================
      # 10. 准备 Android Build Tools
      # ==========================================
      - name: Prepare Android build tools
        shell: bash
        run: |
          set -e

          echo "======================================"
          echo "Preparing Android Build Tools..."
          echo "======================================"

          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"

          if [ -x "$SDKMANAGER" ]; then
            "$SDKMANAGER" \
              --install \
              "build-tools;35.0.0" \
              || true
          fi

          BUILD_TOOLS=$(find "$ANDROID_HOME/build-tools" \
            -maxdepth 1 \
            -mindepth 1 \
            -type d \
            | sort -V \
            | tail -n 1)

          if [ -z "$BUILD_TOOLS" ]; then
            echo "ERROR: Android build-tools not found."
            exit 1
          fi

          echo ""
          echo "Using Build Tools:"
          echo "$BUILD_TOOLS"

          echo "BUILD_TOOLS=$BUILD_TOOLS" >> "$GITHUB_ENV"


      # ==========================================
      # 11. 创建临时签名密钥
      # ==========================================
      - name: Generate signing keystore
        shell: bash
        run: |
          set -e

          echo "======================================"
          echo "Generating signing keystore..."
          echo "======================================"

          mkdir -p signing

          keytool \
            -genkeypair \
            -v \
            -keystore signing/release.keystore \
            -alias douyin \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass douyin123456 \
            -keypass douyin123456 \
            -dname "CN=Douyin Liquid Glass, OU=Android, O=Local, L=Tokyo, ST=Tokyo, C=JP"

          echo ""
          echo "Keystore generated successfully."


      # ==========================================
      # 12. 给 APK 签名
      # ==========================================
      - name: Sign APK
        shell: bash
        run: |
          set -e

          mkdir -p output

          SIGNED_APK="output/Douyin-Liquid-Glass-v4-signed.apk"

          echo "======================================"
          echo "Signing APK..."
          echo "======================================"

          echo ""
          echo "Input APK:"
          echo "$APK"

          echo ""
          echo "Output APK:"
          echo "$SIGNED_APK"

          "$BUILD_TOOLS/apksigner" sign \
            --ks signing/release.keystore \
            --ks-key-alias douyin \
            --ks-pass pass:douyin123456 \
            --key-pass pass:douyin123456 \
            --out "$SIGNED_APK" \
            "$APK"

          echo ""
          echo "APK signed successfully."

          ls -lh "$SIGNED_APK"


      # ==========================================
      # 13. 验证 APK 签名
      # ==========================================
      - name: Verify APK signature
        shell: bash
        run: |
          set -e

          echo "======================================"
          echo "Verifying APK signature..."
          echo "======================================"

          "$BUILD_TOOLS/apksigner" verify \
            --verbose \
            output/Douyin-Liquid-Glass-v4-signed.apk

          echo ""
          echo "APK signature verification successful."


      # ==========================================
      # 14. 显示 APK SHA256
      # ==========================================
      - name: Show APK information
        shell: bash
        run: |
          set -e

          echo "======================================"
          echo "FINAL APK"
          echo "======================================"

          ls -lh output/Douyin-Liquid-Glass-v4-signed.apk

          echo ""
          echo "SHA256:"
          sha256sum output/Douyin-Liquid-Glass-v4-signed.apk


      # ==========================================
      # 15. 上传最终 APK
      # ==========================================
      - name: Upload signed APK
        uses: actions/upload-artifact@v4
        with:
          name: Douyin-Liquid-Glass-v4-signed
          path: output/Douyin-Liquid-Glass-v4-signed.apk
          if-no-files-found: error
          retention-days: 7

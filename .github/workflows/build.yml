name: Build APK

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - "Douyin-Liquid-Glass-v14-tiny-scale-black-edge-fix-build-ready-1-fixed-1.zip"
      - ".github/workflows/build.yml"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ""

      - name: Accept Android SDK licenses
        run: |
          yes | sdkmanager --licenses >/dev/null || true

      - name: Install Android SDK 37
        run: |
          sdkmanager --install \
            "platforms;android-37.0" \
            "build-tools;37.0.0"

      - name: Extract project
        run: |
          mkdir project
          unzip -q "Douyin-Liquid-Glass-v14-tiny-scale-black-edge-fix-build-ready-1-fixed-1.zip" -d project

      - name: Make Gradle executable
        run: |
          chmod +x project/gradlew

      - name: Configure Maven repositories
        working-directory: project
        run: |
          mkdir -p ~/.gradle
          cat > ~/.gradle/init.gradle <<'EOF'
          allprojects {
              buildscript {
                  repositories {
                      google()
                      mavenCentral()
                  }
              }

              repositories {
                  google()
                  mavenCentral()
              }
          }
          EOF

      - name: Check Gradle environment
        working-directory: project
        run: |
          ./gradlew --version

      - name: Build APK
        working-directory: project
        run: |
          ./gradlew :app:assembleDebug \
            --no-daemon \
            --stacktrace \
            --info \
            --console=plain

      - name: Find APK
        run: |
          find project/app/build/outputs/apk \
            -type f \
            -name "*.apk" \
            -print

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: douyin-liquid-glass-v14-fixed-1-debug
          path: project/app/build/outputs/apk/**/*.apk
          if-no-files-found: error

name: Build APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "Douyin-Liquid-Glass-v5-size-control-auto-bottom-vertical-control-build-ready-3.zip"
      - ".github/workflows/build.yml"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ""

      - name: Accept Android SDK licenses
        run: |
          yes | sdkmanager --licenses || true

      - name: Install Android SDK 37
        run: |
          sdkmanager "platforms;android-37.0"
          sdkmanager "build-tools;37.0.0"

      - name: Extract project
        run: |
          rm -rf project
          mkdir project
          unzip -q "Douyin-Liquid-Glass-v5-size-control-auto-bottom-vertical-control-build-ready-3.zip" -d project

      - name: Find project root
        run: |
          echo "ZIP contents:"
          find project -maxdepth 3 -type f | head -100

      - name: Make Gradle executable
        run: |
          GRADLEW=$(find project -name gradlew -type f | head -1)
          echo "gradlew: $GRADLEW"
          chmod +x "$GRADLEW"
          echo "GRADLEW=$GRADLEW" >> "$GITHUB_ENV"

      - name: Configure Maven
        run: |
          mkdir -p ~/.gradle
          cat > ~/.gradle/init.gradle <<'EOF'
          allprojects {
              buildscript {
                  repositories {
                      google()
                      mavenCentral()
                  }
              }

              repositories {
                  google()
                  mavenCentral()
              }
          }
          EOF

      - name: Build APK
        run: |
          PROJECT_DIR=$(dirname "$GRADLEW")
          cd "$PROJECT_DIR"
          ./gradlew :app:assembleDebug \
            --no-daemon \
            --stacktrace \
            --info \
            --console=plain

      - name: Find APK
        run: |
          find project -type f -name "*.apk" -print

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Douyin-Liquid-Glass-build-ready-3
          path: project/**/build/outputs/apk/**/*.apk
          if-no-files-found: error

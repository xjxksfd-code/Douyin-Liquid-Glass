name: Build Douyin Liquid Glass V3

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Inspect repository
        run: |
          echo "=== Current directory ==="
          pwd

          echo "=== Repository files ==="
          find . -maxdepth 3 -type f | sort | head -300

      - name: Locate Android project
        shell: bash
        run: |
          set -e

          echo "=== Searching for gradlew ==="

          GRADLEW=$(find . -type f -name "gradlew" -print -quit || true)

          if [ -n "$GRADLEW" ]; then
            echo "Found gradlew:"
            echo "$GRADLEW"

          else
            echo "gradlew not found."
            echo "Searching for V3 ZIP..."

            ZIP_FILE=$(find . -type f \
              \( -iname "*v3*.zip" \
              -o -iname "*hierarchy-diagnostic*.zip" \
              -o -iname "*bar-height-control*.zip" \) \
              -print -quit || true)

            if [ -z "$ZIP_FILE" ]; then
              echo "ERROR: No gradlew and no suitable ZIP found."
              echo "Repository contents:"
              find . -maxdepth 4 -type f -print
              exit 1
            fi

            echo "Found ZIP:"
            echo "$ZIP_FILE"

            mkdir -p extracted-v3

            unzip -o "$ZIP_FILE" -d extracted-v3

            echo "=== Extracted files ==="
            find extracted-v3 -maxdepth 4 -type f -print

            GRADLEW=$(find extracted-v3 \
              -type f \
              -name "gradlew" \
              -print -quit || true)

            if [ -z "$GRADLEW" ]; then
              echo "ERROR: ZIP does not contain gradlew."
              exit 1
            fi

            echo "Found gradlew inside ZIP:"
            echo "$GRADLEW"
          fi

          PROJECT_DIR=$(dirname "$GRADLEW")

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo "=== Android project directory ==="
          echo "$PROJECT_DIR"

          echo "=== Project files ==="
          ls -la "$PROJECT_DIR"

      - name: Prepare Gradle repositories
        run: |
          mkdir -p ~/.gradle

          cat > ~/.gradle/init.gradle <<'EOF'
          allprojects {
              repositories {
                  google()
                  mavenCentral()
              }
          }

          settingsEvaluated { settings ->
              settings.pluginManagement {
                  repositories {
                      google()
                      mavenCentral()
                      gradlePluginPortal()
                  }
              }

              settings.dependencyResolutionManagement {
                  repositories {
                      google()
                      mavenCentral()
                  }
              }
          }
          EOF

      - name: Make Gradle executable
        run: |
          chmod +x "$PROJECT_DIR/gradlew"

      - name: Build Release APK
        run: |
          cd "$PROJECT_DIR"
          ./gradlew assembleRelease --stacktrace

      - name: Find APK
        run: |
          echo "=== APK files ==="
          find "$PROJECT_DIR" -type f -name "*.apk" -print

      - name: Package V3 build
        run: |
          set -e

          mkdir -p diagnostic-output

          find "$PROJECT_DIR" \
            -type f \
            -name "*.apk" \
            -exec cp {} diagnostic-output/ \;

          echo "=== Packaged files ==="
          ls -lah diagnostic-output

          if [ -z "$(find diagnostic-output -type f -name '*.apk' -print -quit)" ]; then
            echo "ERROR: No APK found."
            exit 1
          fi

          cd diagnostic-output

          zip -r ../Douyin-Liquid-Glass-v3-bar-height-control.zip .

      - name: Upload V3 build
        uses: actions/upload-artifact@v4
        with:
          name: Douyin-Liquid-Glass-v3-bar-height-control
          path: Douyin-Liquid-Glass-v3-bar-height-control.zip
          if-no-files-found: error

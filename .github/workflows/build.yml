name: Build Douyin Liquid Glass V3 Signed

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Extract V3 project
        shell: bash
        run: |
          set -e

          ZIP="Douyin-Liquid-Glass-v15-hierarchy-diagnostic-v3.zip"

          if [ ! -f "$ZIP" ]; then
            echo "ERROR: V3 ZIP not found:"
            echo "$ZIP"
            exit 1
          fi

          rm -rf v3-project
          mkdir -p v3-project

          unzip -q "$ZIP" -d v3-project

          echo "=== Extracted project ==="
          find v3-project -maxdepth 3 -type f | sort | head -300

      - name: Locate Gradle project
        shell: bash
        run: |
          set -e

          GRADLEW=$(find v3-project \
            -type f \
            -name "gradlew" \
            -print -quit)

          if [ -z "$GRADLEW" ]; then
            echo "ERROR: gradlew not found after extraction."
            find v3-project -maxdepth 5 -type f -print
            exit 1
          fi

          PROJECT_DIR=$(dirname "$GRADLEW")

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo "=== Gradle project ==="
          echo "$PROJECT_DIR"

          ls -la "$PROJECT_DIR"

      - name: Prepare Gradle repositories
        run: |
          mkdir -p ~/.gradle

          cat > ~/.gradle/init.gradle <<'EOF'
          allprojects {
              repositories {
                  google()
                  mavenCentral()
              }
          }

          settingsEvaluated { settings ->
              settings.pluginManagement {
                  repositories {
                      google()
                      mavenCentral()
                      gradlePluginPortal()
                  }
              }

              settings.dependencyResolutionManagement {
                  repositories {
                      google()
                      mavenCentral()
                  }
              }
          }
          EOF

      - name: Make Gradle executable
        run: |
          chmod +x "$PROJECT_DIR/gradlew"

      - name: Build Release APK
        run: |
          cd "$PROJECT_DIR"

          ./gradlew clean assembleRelease --stacktrace

      - name: Locate generated APK
        shell: bash
        run: |
          set -e

          APK=$(find "$PROJECT_DIR/app/build/outputs/apk/release" \
            -type f \
            -name "*.apk" \
            -print -quit)

          if [ -z "$APK" ]; then
            echo "ERROR: Release APK not found."

            find "$PROJECT_DIR/app/build/outputs" \
              -type f \
              -print || true

            exit 1
          fi

          echo "APK=$APK" >> "$GITHUB_ENV"

          echo "=== Generated APK ==="
          ls -lah "$APK"

      - name: Generate signing key
        run: |
          set -e

          mkdir -p signing

          keytool -genkeypair \
            -v \
            -keystore signing/douyin-liquid-glass.jks \
            -alias douyin \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass douyin123456 \
            -keypass douyin123456 \
            -dname "CN=Douyin Liquid Glass, OU=Android, O=LiquidGlass, L=Tokyo, ST=Tokyo, C=JP"

      - name: Sign APK
        run: |
          set -e

          BUILD_TOOLS=$(find "$ANDROID_HOME/build-tools" \
            -mindepth 1 \
            -maxdepth 1 \
            -type d \
            | sort -V \
            | tail -1)

          echo "Using build-tools:"
          echo "$BUILD_TOOLS"

          "$BUILD_TOOLS/zipalign" \
            -f \
            4 \
            "$APK" \
            aligned.apk

          "$BUILD_TOOLS/apksigner" sign \
            --ks signing/douyin-liquid-glass.jks \
            --ks-key-alias douyin \
            --ks-pass pass:douyin123456 \
            --key-pass pass:douyin123456 \
            --out Douyin-Liquid-Glass-v3-signed.apk \
            aligned.apk

      - name: Verify APK signature
        run: |
          set -e

          BUILD_TOOLS=$(find "$ANDROID_HOME/build-tools" \
            -mindepth 1 \
            -maxdepth 1 \
            -type d \
            | sort -V \
            | tail -1)

          "$BUILD_TOOLS/apksigner" verify \
            --verbose \
            Douyin-Liquid-Glass-v3-signed.apk

      - name: Package final APK
        run: |
          set -e

          mkdir -p output

          cp Douyin-Liquid-Glass-v3-signed.apk output/

          cd output

          zip -q \
            ../Douyin-Liquid-Glass-v3-bar-height-control-signed.zip \
            Douyin-Liquid-Glass-v3-signed.apk

          echo "=== FINAL ==="
          ls -lah ../Douyin-Liquid-Glass-v3-bar-height-control-signed.zip
          ls -lah Douyin-Liquid-Glass-v3-signed.apk

      - name: Upload final build
        uses: actions/upload-artifact@v4
        with:
          name: Douyin-Liquid-Glass-v3-bar-height-control-signed
          path: |
            Douyin-Liquid-Glass-v3-signed.apk
            Douyin-Liquid-Glass-v3-bar-height-control-signed.zip
          if-no-files-found: error

name: Build Douyin Liquid Glass V5

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      # ==========================================
      # 1. Checkout
      # ==========================================
      - name: Checkout repository
        uses: actions/checkout@v4


      # ==========================================
      # 2. JDK 21
      # ==========================================
      - name: Setup JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'


      # ==========================================
      # 3. 查找 V5 ZIP
      # ==========================================
      - name: Find V5 source ZIP
        shell: bash
        run: |
          set -e

          echo "======================================"
          echo "Searching for V5 source ZIP"
          echo "======================================"

          ZIP_FILE=$(find . \
            -maxdepth 3 \
            -type f \
            \( \
              -name 'v5src.zip.zip' \
              -o \
              -name 'Douyin-Liquid-Glass-v5-refraction-fix.zip' \
            \) \
            | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: V5 source ZIP not found."
            echo ""
            echo "Repository files:"
            find . -maxdepth 4 -type f | sort
            exit 1
          fi

          echo ""
          echo "Found V5 ZIP:"
          echo "$ZIP_FILE"

          echo "ZIP_FILE=$ZIP_FILE" >> "$GITHUB_ENV"


      # ==========================================
      # 4. 解压 V5
      # ==========================================
      - name: Extract V5 source
        shell: bash
        run: |
          set -e

          echo "======================================"
          echo "Extracting V5 source"
          echo "======================================"

          rm -rf build-project
          mkdir -p build-project

          unzip -q "$ZIP_FILE" -d build-project

          echo ""
          echo "Extracted files:"
          find build-project -maxdepth 3 -type f | sort | head -300


      # ==========================================
      # 5. 定位 v5src 项目
      # ==========================================
      - name: Locate V5 Gradle project
        shell: bash
        run: |
          set -e

          PROJECT_DIR="build-project/v5src"

          if [ ! -f "$PROJECT_DIR/gradlew" ]; then
            echo "ERROR: v5src/gradlew not found."

            echo ""
            echo "Searching for gradlew:"
            find build-project \
              -type f \
              -name gradlew \
              -print

            exit 1
          fi

          if [ ! -f "$PROJECT_DIR/settings.gradle.kts" ]; then
            echo "ERROR: settings.gradle.kts not found."
            exit 1
          fi

          if [ ! -d "$PROJECT_DIR/app" ]; then
            echo "ERROR: app directory not found."
            exit 1
          fi

          chmod +x "$PROJECT_DIR/gradlew"

          echo "======================================"
          echo "V5 Gradle project:"
          echo "$PROJECT_DIR"
          echo "======================================"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"


      # ==========================================
      # 6. 检查 Java
      # ==========================================
      - name: Check Java
        shell: bash
        run: |
          set -e

          echo "======================================"
          echo "Java"
          echo "======================================"

          java -version

          echo ""
          echo "JAVA_HOME:"
          echo "$JAVA_HOME"


      # ==========================================
      # 7. 检查 Gradle
      # ==========================================
      - name: Check Gradle
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          echo "======================================"
          echo "Gradle"
          echo "======================================"

          ./gradlew --version


      # ==========================================
      # 8. 构建 Release APK
      # ==========================================
      - name: Build Release APK
        shell: bash
        env:
          GRADLE_OPTS: >-
            -Dorg.gradle.jvmargs=-Xmx2g
            -Dfile.encoding=UTF-8
        run: |
          set -e

          cd "$PROJECT_DIR"

          echo "======================================"
          echo "Building V5 Release APK"
          echo "======================================"

          ./gradlew \
            --no-daemon \
            --stacktrace \
            assembleRelease


      # ==========================================
      # 9. 查找 APK
      # ==========================================
      - name: Locate built APK
        shell: bash
        run: |
          set -e

          echo "======================================"
          echo "Searching for built APK"
          echo "======================================"

          find "$PROJECT_DIR" \
            -type f \
            -path '*/build/outputs/apk/release/*.apk' \
            -print

          APK=$(find "$PROJECT_DIR" \
            -type f \
            -path '*/build/outputs/apk/release/*.apk' \
            -name '*.apk' \
            | head -n 1)

          if [ -z "$APK" ]; then
            echo ""
            echo "ERROR: Release APK not found."
            exit 1
          fi

          echo ""
          echo "Built APK:"
          echo "$APK"

          echo "APK=$APK" >> "$GITHUB_ENV"


      # ==========================================
      # 10. 准备 Android Build Tools
      # ==========================================
      - name: Prepare Android build tools
        shell: bash
        run: |
          set -e

          echo "======================================"
          echo "Preparing Android Build Tools"
          echo "======================================"

          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"

          if [ -x "$SDKMANAGER" ]; then
            "$SDKMANAGER" \
              --install \
              "build-tools;35.0.0" \
              || true
          fi

          BUILD_TOOLS=$(find "$ANDROID_HOME/build-tools" \
            -maxdepth 1 \
            -mindepth 1 \
            -type d \
            | sort -V \
            | tail -n 1)

          if [ -z "$BUILD_TOOLS" ]; then
            echo "ERROR: Android build-tools not found."
            exit 1
          fi

          echo ""
          echo "Using:"
          echo "$BUILD_TOOLS"

          echo "BUILD_TOOLS=$BUILD_TOOLS" >> "$GITHUB_ENV"


      # ==========================================
      # 11. 生成签名密钥
      # ==========================================
      - name: Generate signing keystore
        shell: bash
        run: |
          set -e

          echo "======================================"
          echo "Generating signing keystore"
          echo "======================================"

          mkdir -p signing

          keytool \
            -genkeypair \
            -v \
            -keystore signing/release.keystore \
            -alias douyin \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass douyin123456 \
            -keypass douyin123456 \
            -dname "CN=Douyin Liquid Glass, OU=Android, O=Local, L=Tokyo, ST=Tokyo, C=JP"

          echo ""
          echo "Keystore generated."


      # ==========================================
      # 12. 签名 APK
      # ==========================================
      - name: Sign APK
        shell: bash
        run: |
          set -e

          mkdir -p output

          SIGNED_APK="output/Douyin-Liquid-Glass-v5-signed.apk"

          echo "======================================"
          echo "Signing V5 APK"
          echo "======================================"

          echo ""
          echo "Input:"
          echo "$APK"

          echo ""
          echo "Output:"
          echo "$SIGNED_APK"

          "$BUILD_TOOLS/apksigner" sign \
            --ks signing/release.keystore \
            --ks-key-alias douyin \
            --ks-pass pass:douyin123456 \
            --key-pass pass:douyin123456 \
            --out "$SIGNED_APK" \
            "$APK"

          echo ""
          echo "APK signed successfully."

          ls -lh "$SIGNED_APK"


      # ==========================================
      # 13. 验证签名
      # ==========================================
      - name: Verify APK signature
        shell: bash
        run: |
          set -e

          echo "======================================"
          echo "Verifying APK"
          echo "======================================"

          "$BUILD_TOOLS/apksigner" verify \
            --verbose \
            output/Douyin-Liquid-Glass-v5-signed.apk

          echo ""
          echo "Signature verification successful."


      # ==========================================
      # 14. 显示 APK 信息
      # ==========================================
      - name: Show APK information
        shell: bash
        run: |
          set -e

          echo "======================================"
          echo "FINAL V5 APK"
          echo "======================================"

          ls -lh output/Douyin-Liquid-Glass-v5-signed.apk

          echo ""
          echo "SHA256:"
          sha256sum output/Douyin-Liquid-Glass-v5-signed.apk


      # ==========================================
      # 15. 上传 APK
      # ==========================================
      - name: Upload V5 APK
        uses: actions/upload-artifact@v4
        with:
          name: Douyin-Liquid-Glass-v5-signed
          path: output/Douyin-Liquid-Glass-v5-signed.apk
          if-no-files-found: error
          retention-days: 7
